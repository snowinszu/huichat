name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # typecheck/lint don't need a working better-sqlite3 binary, and
      # ubuntu-latest has no native build toolchain configured — skip the
      # postinstall electron-rebuild step that would otherwise fail here.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm run lint
