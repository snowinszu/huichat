name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm run lint

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist-script: dist:mac
            artifact-name: mac-dmg
            artifact-glob: release/*.dmg
          - os: windows-latest
            dist-script: dist:win
            artifact-name: win-installer
            artifact-glob: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Full install (with postinstall's electron-rebuild) is required here —
      # unlike the verify job, this one needs a working native better-sqlite3
      # binary for the target platform/arch, which electron-builder's
      # npmRebuild: true (electron-builder.yml) also re-verifies at pack time.
      - run: npm ci

      - run: npm run ${{ matrix.dist-script }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

      # Each matrix leg uploads its own asset to the same tag's Release —
      # softprops/action-gh-release upserts the release rather than failing
      # when it's called again for a tag that already has one, so the two
      # parallel legs end up contributing one asset each to a single Release.
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.artifact-glob }}
          # Tags with a pre-release suffix (v1.0.0-rc1, v1.0.0-beta) are
          # published as GitHub pre-releases; plain vX.Y.Z tags are full
          # releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
